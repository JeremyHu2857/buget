<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>极简记账</title>
<meta name="description" content="极简记账，管控每日预算">
<meta name="format-detection" content="telephone=no">

<!-- iOS 主屏幕：独立窗口运行，隐藏 Safari 地址栏和工具栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="极简记账">
<!-- default：保留原生状态栏（深色文字），页面从状态栏下方开始 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f0f0f0">
<meta name="color-scheme" content="light">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- 导航栏 -->
  <header class="header">
    <div class="header-inner">
      <button class="icon-btn calendar-btn" aria-label="日历">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <rect x="3" y="5" width="31" height="29" rx="8" fill="#303030"/>
          <rect x="6" y="13" width="25" height="18" rx="5" fill="#f0f0f0"/>
          <rect x="16" y="16" width="5" height="5" rx="1.8" fill="#303030"/>
          <rect x="23" y="16" width="5" height="5" rx="1.8" fill="#303030"/>
          <rect x="9" y="23" width="5" height="5" rx="1.8" fill="#303030"/>
          <rect x="16" y="23" width="5" height="5" rx="1.8" fill="#303030"/>
        </svg>
      </button>
      <div class="date">10月4日<span class="today">今天</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" aria-label="分享">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#303030" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16h1a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3h1"/>
          <path d="M18 22V8"/>
          <path d="M13 11l4.23-5.08a1 1 0 0 1 1.54 0L23 11"/>
        </svg>
      </button>
      <button class="icon-btn setting-btn" aria-label="设置">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15" fill="#303030"/>
          <path d="M24.845 16A4 4 0 0 1 24.845 20L23.155 22.928A4 4 0 0 1 19.691 24.928L16.309 24.928A4 4 0 0 1 12.845 22.928L11.155 20A4 4 0 0 1 11.155 16L12.845 13.072A4 4 0 0 1 16.309 11.072L19.691 11.072A4 4 0 0 1 23.155 13.072Z" fill="#f0f0f0"/>
          <circle cx="18" cy="18" r="3" fill="#303030"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main">
    <div class="gap-top"></div>

    <!-- 主显示：外环 240×240，圆心 (120,120) -->
    <div class="gauge">
      <svg viewBox="0 0 240 240">
        <path id="ringTrack" fill="#303030" fill-opacity="0.2"/>
        <path id="ringProgress" fill="#303030" fill-opacity="0.8"/>
        <g id="ticks" stroke="#303030" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round"></g>
      </svg>
      <div class="gauge-value">50</div>
      <div class="gauge-pill"><span>50/50</span></div>
      <div class="gauge-label">今日预算</div>
    </div>

    <div class="gap-mid"></div>

    <!-- 今日剩余数值 -->
    <div class="amount">
      <div class="yen">￥</div>
      <div class="num">50.00</div>
    </div>

    <div class="gap-bottom"></div>
  </main>

  <!-- 菜单栏 -->
  <footer class="bottom-bar">
    <button class="glass-btn round" aria-label="账本">
      <svg width="26" height="26" viewBox="0 0 26 26">
        <rect x="4" y="2" width="18" height="22" rx="5" fill="#303030" fill-opacity="0.8"/>
        <path d="M9 7v12M14 9.5h3.5M14 15h3.5" stroke="#f6f6f6" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="glass-btn pill" aria-label="记账">
      <svg width="26" height="26" viewBox="0 0 26 26">
        <path d="M13 5v16M5 13h16" stroke="#303030" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="glass-btn round" aria-label="统计">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="#303030" fill-opacity="0.8">
        <rect x="4" y="7" width="4" height="17" rx="1.5"/>
        <rect x="11" y="11" width="4" height="13" rx="1.5"/>
        <rect x="18" y="4" width="4" height="20" rx="1.5"/>
      </svg>
    </button>
  </footer>

</div>

<script src="js/app.js"></script>
</body>
</html>
