<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>极简记账</title>
<meta name="description" content="极简记账，管控每日预算">
<meta name="format-detection" content="telephone=no">

<!-- iOS 主屏幕：独立窗口运行，隐藏 Safari 地址栏和工具栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="极简记账">
<!-- default：保留原生状态栏（深色文字），页面从状态栏下方开始 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f5">
<meta name="color-scheme" content="light">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">

  <!-- 顶部栏 -->
  <header class="header">
    <div class="header-inner">
      <button class="icon-btn calendar-btn" aria-label="日历">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <rect x="4" y="7.5" width="28" height="21" rx="4.5" fill="none" stroke="#333" stroke-width="3"/>
          <rect x="15.9" y="12.4" width="4.4" height="4.4" rx="1" fill="#333"/>
          <rect x="21.9" y="12.4" width="4.4" height="4.4" rx="1" fill="#333"/>
          <rect x="9.9" y="18.6" width="4.4" height="4.4" rx="1" fill="#333"/>
          <rect x="15.9" y="18.6" width="4.4" height="4.4" rx="1" fill="#333"/>
        </svg>
      </button>
      <div class="date">10月4日<span class="today">今天</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" aria-label="分享">
        <svg width="22" height="24" viewBox="0 0 22 24" fill="none" stroke="#333" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 9.3H5a2 2 0 0 0-2 2v9.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9.5a2 2 0 0 0-2-2h-2"/>
          <path d="M11 15.2V1.8"/>
          <path d="M6.6 6.1L11 1.7l4.4 4.4"/>
        </svg>
      </button>
      <button class="icon-btn setting-btn" aria-label="设置">
        <svg width="31" height="31" viewBox="0 0 31 31">
          <circle cx="15.5" cy="15.5" r="15.5" fill="#333"/>
          <polygon points="21.4,15.5 18.45,20.6 12.55,20.6 9.6,15.5 12.55,10.4 18.45,10.4" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="15.5" cy="15.5" r="2.4" fill="#333"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main">
    <div class="gap-top"></div>

    <div class="gauge">
      <svg viewBox="0 0 284 266">
        <path d="M 46.43 227.15 A 128 128 0 1 1 237.57 227.15" fill="none" stroke="#4f4f4f" stroke-width="28" stroke-linecap="round"/>
        <g id="ticks" stroke-width="6" stroke-linecap="round"></g>
      </svg>
      <div class="gauge-value">50</div>
      <div class="gauge-pill"><span>50/50</span></div>
      <div class="gauge-label">今日预算</div>
    </div>

    <div class="gap-mid"></div>

    <div class="amount">
      <div class="yen">¥</div>
      <div class="num">50.00</div>
    </div>

    <div class="gap-bottom"></div>
  </main>

  <!-- 底部操作栏 -->
  <footer class="bottom-bar">
    <button class="round-btn" aria-label="账单">
      <svg width="21" height="21" viewBox="0 0 21 21">
        <rect x="0" y="0" width="21" height="21" rx="4.5" fill="#4f4f4f"/>
        <path d="M7 4.5v12" stroke="#f6f6f6" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M10.6 8.3h5M10.6 12.7h5" stroke="#f6f6f6" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="add-btn" aria-label="记一笔">
      <svg width="24" height="24" viewBox="0 0 24 24" stroke="#4f4f4f" stroke-width="4.6" stroke-linecap="round">
        <path d="M12 2.5v19M2.5 12h19"/>
      </svg>
    </button>
    <button class="round-btn" aria-label="统计">
      <svg width="22" height="21" viewBox="0 0 22 21" fill="#4f4f4f">
        <rect x="0.5" y="7" width="5" height="14" rx="1.5"/>
        <rect x="8.5" y="10.5" width="5" height="10.5" rx="1.5"/>
        <rect x="16.5" y="0" width="5" height="21" rx="1.5"/>
      </svg>
    </button>
  </footer>

</div>

<script src="/js/app.js"></script>
</body>
</html>
